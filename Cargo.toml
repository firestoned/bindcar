[package]
name = "bindcar"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
authors = ["Erick Bourgeois <firestoned@firestoned.io>"]
license = "MIT"
description = "HTTP REST API for managing BIND9 zones via rndc"
repository = "https://github.com/firestoned/bindcar"
keywords = ["dns", "bind9", "rndc", "api", "kubernetes"]
categories = ["api-bindings", "network-programming", "web-programming::http-server"]
readme = "README.md"

# Library configuration
[lib]
name = "bindcar"
path = "src/lib.rs"

# Binary configuration
[[bin]]
name = "bindcar"
path = "src/main.rs"
# The binary IS the HTTP server, so it cannot be built without the stack.
# `cargo build --no-default-features` builds the library alone, which is the
# library-only consumer's configuration.
required-features = ["server"]

[dependencies]
# HTTP server framework
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["trace"], optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# OpenAPI / Swagger
utoipa = { version = "5", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }

# Metrics
prometheus = "0.14"
lazy_static = "1.5"

# Rate limiting
tower_governor = { version = "0.8", optional = true }

# RNDC client
rndc = "0.1.5"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Parsing
nom = "8"

# Constant-time comparison for shared-secret API token (avoids timing side-channels)
subtle = "2.6"

# Secure temp files (0600) for passing the TSIG key to nsupdate via -k instead of argv
tempfile = "3"

# Kubernetes client (optional, for token validation)
kube = { version = "4.0", features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.28", default-features = false, optional = true }
sha2 = "0.11"

# TLS transport for the HTTP API — behind the `tls` feature (see src/tls.rs).
# These are the only crates a plaintext-only consumer can shed: `rustls` and
# `tokio-rustls` reach the default graph solely through this feature (kube pulls
# rustls too, but kube is itself optional), so turning `tls` off removes ~30
# crates. `hyper`/`hyper-util` are gated for tidiness only — axum pulls hyper
# regardless, so no graph saving comes from them.
#
# `ring` is pinned as the crypto provider to match the provider kube's
# `rustls-tls` feature already installs, so enabling `k8s-token-review` cannot
# produce two providers and the "no process-level CryptoProvider" panic.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"], optional = true }

[features]
# TLS is ON by default so `cargo install bindcar` and the published container
# image can always terminate TLS. Shipping release artifacts without a feature
# an operator needs has burned this project before: v0.7.1 images were built
# without `k8s-token-review`, which left bindy unable to run its configured auth
# mode on the stock image at all.
#
# Library consumers that only want the data types can opt out:
#     bindcar = { version = "0.8", default-features = false }
default = ["server", "tls"]

# The HTTP server: routes, middleware, rate limiter, OpenAPI/Swagger. This is
# what the `bindcar` binary is, so the binary carries `required-features`.
# Turning it off leaves the data types, the RNDC/nsupdate executors and the
# config parsers — everything a library consumer actually imports.
server = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:utoipa",
    "dep:utoipa-swagger-ui",
    "dep:tower_governor",
]

# HTTPS/mTLS listener, certificate hot-reload. Implies `server`: TLS is the
# transport *for* the HTTP server, so it is meaningless without it. Without
# this feature bindcar serves plaintext only and refuses to start if TLS
# options are supplied.
tls = [
    "server",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:hyper",
    "dep:hyper-util",
]
# Pin the k8s-openapi API version via the feature so a release binary build
# (`cargo build --release --features k8s-token-review`) needs no
# K8S_OPENAPI_ENABLED_VERSION env var — the version travels with the feature,
# on host cargo and in the aarch64 cross container alike.
k8s-token-review = ["server", "kube", "k8s-openapi", "k8s-openapi/v1_32"]

[dev-dependencies]
# Testing
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }
serial_test = "4.0"
tempfile = "3.27"

# Enable k8s-openapi version for tests and examples
k8s-openapi = { version = "0.28", features = ["v1_32"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
